name = "corktalk"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "corktalk.beecork.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[observability]
enabled = true

# Per-network limit on every API call (the Worker checks it before the hub).
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
