name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.168.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done && sh -n plugin/bin/corktalk && for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/.mcp.json plugin/hooks/hooks.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - name: Text tests
        run: node --test test/text.test.js
      - name: Plugin script tests
        run: sh test/hook.test.sh
      - name: Dry-run bundle
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir dist

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --var GIT_SHA:${{ github.sha }}
      - name: Smoke test (the new version is live and works)
        run: |
          for i in $(seq 1 18); do
            curl -sf -m 10 https://corktalk.beecork.com/health | grep -q "ok ${GITHUB_SHA}" && break
            [ "$i" = 18 ] && { echo "new version never went live"; exit 1; }
            sleep 10
          done
          curl -sf -m 10 https://corktalk.beecork.com/ | grep -q "Let your Claude"
          curl -sf -m 10 -X POST -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' https://corktalk.beecork.com/mcp | grep -q send_message
