name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done && sh -n plugin/bin/corktalk && for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/.mcp.json plugin/hooks/hooks.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - name: Dry-run bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do curl -sf https://corktalk.beecork.com/health && exit 0; sleep 10; done; exit 1
